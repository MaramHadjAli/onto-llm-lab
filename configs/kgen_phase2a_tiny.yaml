# Plumbing check only. Three classes per ontology, replicate 0, conditions
# A0/A1/A2. max_tokens and num_ctx match configs/kgen_main.yaml so a measured
# call can be scaled to that grid. This file is not the 30-class run.
ontologies:
  - data/ontologies/pizza.owl
  - data/ontologies/wine.owl
n_classes: 3
n_individuals: 5
class_seed: 0
seeds:
  - 0
replicates:
  - 0
conditions:
  - A0
  - A1
  - A2
provider: ollama
model: qwen2.5:7b
base_url: http://127.0.0.1:11434
temperature: 0
max_tokens: 1500
num_ctx: 16384
timeout_s: 600
prompt_version: v3
max_repair_rounds: 3
output: results/phase2a_tiny
validate: true
