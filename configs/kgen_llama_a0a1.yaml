# Second model, a different family from Qwen. Same 30-class draw as
# configs/kgen_main.yaml (class_seed 0). A0 and A1 only. A2 waits until the
# Qwen repair loop has been reviewed. Do not run this at the same time as
# the Qwen grid. A larger API model is not part of this file.
ontologies:
  - data/ontologies/pizza.owl
  - data/ontologies/wine.owl
n_classes: 30
n_individuals: 5
class_seed: 0
seeds:
  - 0
replicates:
  - 0
conditions:
  - A0
  - A1
provider: ollama
model: llama3.1:8b
base_url: http://127.0.0.1:11434
temperature: 0
max_tokens: 1500
num_ctx: 16384
timeout_s: 600
prompt_version: v3
max_repair_rounds: 3
output: results/kgen_llama_a0a1
validate: true
