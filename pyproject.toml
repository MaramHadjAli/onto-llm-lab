[project]
name = "onto-llm-lab"
version = "0.1.0"
description = "Reproducible experiments on ontology-controlled LLM generation and explanation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Hayder" },
    { name = "Maram" },
]
dependencies = [
    "httpx==0.28.1",
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "owlready2==0.51",
    "pandas==3.1.0",
    "pydantic==2.14.2",
    "pyshacl==0.40.2",
    "pyyaml==6.0.3",
    "rdflib==7.6.0",
    "scipy==1.17.1",
    "typer==0.27.3",
]

[project.scripts]
ollab = "ollab.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ollab"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ollab", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
